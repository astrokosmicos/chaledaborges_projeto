<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Chalé da Borges</title>
    <link rel="stylesheet" href="../style.css">
</head>
    <body class="page-center">
    <main class="auth-container">
        <div class="auth-card modal small-modal">
            <span class="eyebrow">Primeiro pedido?</span>
            <h2>Cadastre-se</h2>

            <form id="registerForm">
                <label for="registerName">Nome
                    <input type="text" id="registerName" placeholder="Seu nome completo" required>
                </label>
                <label for="registerEmail">E-mail
                    <input type="email" id="registerEmail" placeholder="voce@email.com" required>
                </label>
                <label for="registerPassword">Senha
                    <input type="password" id="registerPassword" placeholder="Crie uma senha" required>
                </label>
                <label for="registerPhone"> Telefone <input type="tel" id="registerPhone" placeholder="(51) 99999-9999">
</label>

                <button type="submit" class="primary-btn full" id="doRegister">Criar conta</button>
                <p id="registerError" class="form-error" hidden></p>

            </form>
        </div>
    </main>
    <script type="module" src="../js/cadastro.js">

    </script>
</body>
</html>
