<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrega - Chalé da Borges</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="toast" id="toast"></div>
    <header class="topbar">
        <a class="brand" href="index.html"><strong> Chalé da Borges</strong></a>
        <nav class="main-nav">
            <a href="cardapio.html">Cardápio</a>
            <a href="entrega.html" class="active">Entrega</a>
        </nav>
        </header>

        <main class="delivery-section">
            <div class="delivery-card">
                <div class="delivery-copy">
                    <span class="eyebrow">entrega sem complicação</span>
                    <h2>Descubra o tempo e o valor da sua entrega.</h2>
                    <p>Selecione seu bairro para verificar a taxa e o tempo estimado.</p>
                    <div class="cep-row">
                        <select id="bairroSelect" class="input-select">
                            <option value="" disabled selected>Selecione seu bairro...</option>
                            <option value="Centro">Centro</option>
                            <option value="imocasa">Imocasa</option>
                            <option value="grassmann">Grassmann</option>
                            <option value="contestado">Contestado</option>
                            <option value="areia">Areia</option>
                            <option value="picadilly">Picadilly</option>
                            <option value="rolantinho">Rolantinho</option>
                            <option value="alto_rolantinho">Alto Rolantinho</option>
                            </select>
                      
                        <button class="primary-btn" id="calcDeliveryBtn">Calcular</button>
                    </div>
                    <div class="delivery-result" id="deliveryResult">
                        <span>⌖</span>
                        <div><strong>Selecione seu bairro</strong><small>Vamos estimar prazo e taxa de entrega.</small></div>
                    </div>
                </div>
            </div>
        </main>

</body>
</html>
