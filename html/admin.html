<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Área da Dona - Chalé da Borges</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="authcontainer" id="adminLoginSection">
        <div class="auth-card small-modal">
            <h2>Área da Dona</h2>
            <p>Informe suas credenciais para gerenciar o site.</p>

            <form id="adminLoginForm">
                <label for="adminUser">Usuário
                    <input type="text" id="adminUser" placeholder="admin" required>
                </label>

                <label for="adminPass">Senha
                    <input type="text" id="adminPass" placeholder="••••••••" required>
            </label>

            <button type="submit" class="primary-btn full">Entrar no painel</button>
            </form>
        </div>
    </main>

    <main class="admin-container" id="adminDashboardSection" hidden>
        <div class="modal admin-modal">

            <div class="admin-header">
                <div>
                    <span class="eyebrow" >Painel Local</span>
                    <h2>Área da dona</h2>
                </div>
                <div style="display: flex; gap: 10px; align-items: center;">
                <span class="admin-badge">DEMO</span>
                <button id="logoutBtn" class="danger-btn">Sair</button>
            </div>
        </div>
        <div class="admin-tabs";>
        <button class="active" data-admin-tab="business">Estabelecimento</button>
        <button data-admin-tab="delivery">Entrega</button>
        <button data-admin-tab="items">Cardápio</button>
        </div>

        <div class="admin-panel active" id="admin-business">
            <div class="form-grid">
                <label for="adminName">Nome
                <input id="adminName">
                </label>

                <label for="adminTagline">Subtítulo
            <input id="adminTagline">
          </label>
          
          <label for="adminAbout" class="wide">Descrição
            <textarea id="adminAbout"></textarea>
          </label>
          
          <label for="adminHours">Horário
            <input id="adminHours">
          </label>
          
          <label for="adminEta">Tempo de entrega
            <input id="adminEta">
          </label>
        </div>
        <button class="primary-btn" id="saveBusiness">Salvar informações</button>
      </div>
 <div class="admin-panel" id="admin-delivery">
        <div class="form-grid">
          <label for="adminBaseFee">Taxa base (R$)
            <input type="number" step="0.50" id="adminBaseFee">
          </label>
          
          <label for="adminRadius">Raio de entrega (km)
            <input type="number" step="1" id="adminRadius">
          </label>
          
          <label for="adminMinTime">Tempo mínimo
            <input type="number" id="adminMinTime">
          </label>
          
          <label for="adminMaxTime">Tempo máximo
            <input type="number" id="adminMaxTime">
          </label>
        </div>
        <button class="primary-btn" id="saveDelivery">Salvar entrega</button>
      </div>
      <div class="admin-panel" id="admin-items">
        <div class="admin-add-row">
          <input id="newItemName" placeholder="Nome do item">
          <input id="newItemPrice" type="number" step="0.01" placeholder="Preço">
          <select id="newItemCategory"></select>
          <button class="primary-btn" id="addItem">Adicionar</button>
        </div>
        <div id="adminItemsList"></div>
      </div>
    </div>
  </main>
  </body>
  </html>
