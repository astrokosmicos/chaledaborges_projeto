<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Área da Dona - Chalé da Borges</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="authcontainer" id="adminLoginSection">
        <div class="auth-card small-modal">
            <h2>Área da Dona</h2>
            <p>Informe suas credenciais para gerenciar o site.</p>

            <form id="adminLoginForm">
                <label for="adminUser">Usuário
                    <input type="text" id="adminUser" placeholder="admin" required>
                </label>

                <label for="adminPass">Senha
                    <input type="text" id="adminPass" placeholder="••••••••" required>
            </label>

            <button type="submit" class="primary-btn full">Entrar no painel</button>
            </form>
        </div>
    </main>
