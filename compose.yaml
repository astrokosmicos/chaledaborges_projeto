services:
  proxy:
    image: caddy:2.10
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./:/srv/original:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
  app:
    build: ./backend
    volumes:
      - ./:/srv/original:ro
    environment:
      DB_HOST: db
      DB_NAME: chale
      DB_USER: chale_app
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      APP_ENV: production
      SITE_ROOT: /srv/original
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: chale
      MYSQL_USER: chale_app
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/db/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
volumes:
  mysql_data:
  caddy_data:
  caddy_config:
